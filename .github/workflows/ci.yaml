name: "CI"

on:
    push:
        branches: 
            - main
jobs:
    static_code_analysis:
        name: "Build by - Author: ${{ github.actor }}"
        runs-on: ubuntu
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
            
            - name: Install uv
              uses: astral-sh/setup-uv@v8
            
            - name: Install python
              run: uv python install

            - name: Install dependencies
              run: uv add pytest flake8
            
            - name: Run linters
              run: uv run pytest
            
              
