[tool.poetry]
name = "keepass-yaml-env"
version = "1.0.2"
description = "Load KeePass secrets directly into your development environment at runtime—no plain-text .env files required."
authors = ["robxxt <personal.robert@protonmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
pyyaml = "^6.0.1"
pykeepass = "^4.0.7"
pydantic = "^2.13.4"
bandit = "^1.9.4"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.3"
ruff = "^0.15.16"
pre-commit = "^4.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
keepass-yaml-env = "keepass_yaml_env.cli:main"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]  # errors, pyflakes, imports
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["your_package_name"]
